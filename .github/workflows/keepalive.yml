# Render's free tier sleeps after ~15 idle minutes; a ping every 10 minutes keeps the demo warm.
# Set the repository variable RENDER_URL (Settings -> Variables -> Actions) to the live URL.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.RENDER_URL }}/healthz" || true
